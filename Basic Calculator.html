<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
body {
    background-color: black;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

h1 {
    text-align: center;
    color: white;
    font-family: 'Courier New', monospace;
    font-size: 26px;
    margin-bottom: 15px;
    letter-spacing: 2px;
}

#calculator {
    background: #3c4895;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

#display {
    width: 90%;
    height: 60px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    margin-bottom: 15px;
    padding: 10px;
    text-align: right;
    background: #2d2d44;
    color: #fff;
}

#keys {
    display: grid;
    grid-template-columns: repeat(4, 60px);
    gap: 10px;
}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    color: white;
    background: #4e54c8;
}

button:hover {
    transform: scale(1.1);
    opacity: 0.9;
}

.op-btn {
    background: #ff7a18;
}

.eq-btn {
    background: #00c9a7;
}

.clr-btn {
    background: #ff4b5c;
}
</style>
</head>
<body>

<div id="calculator">
    <h1>SIMPLE CALCULATOR</h1>
    <input id="display" readonly>
    <div id="keys">
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button class="op-btn" onclick="appendToDisplay('+')">+</button>

        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button class="op-btn" onclick="appendToDisplay('-')">-</button>

        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button class="op-btn" onclick="appendToDisplay('*')">*</button>

        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button class="eq-btn" onclick="calculate()">=</button>
        <button class="clr-btn" onclick="clearDisplay()">C</button>
    </div>
</div>

<script>
    let display = document.getElementById("display");

    function appendToDisplay(input) {
        display.value += input;
    }

    function clearDisplay() {
        display.value = "";
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch(e) {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
